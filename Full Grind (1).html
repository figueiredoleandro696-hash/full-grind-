.ch{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.b{max-width:85%;padding:14px 16px;border-radius:16px;background:var(--soft)}.b.u{align-self:flex-end;background:var(--v);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px}.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px}.dr form{margin:0 18px 18px;border:1px solid var(--line);border-radius:99px;padding:5px;display:flex}.dr form input{flex:1;border:0;padding:0 14px;background:none}.dr form input:focus{outline:0}.dr form button{width:42px;height:42px;border-radius:50%;border:0;background:var(--v);color:#fff}

/* coach */
.code{font:700 34px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;background:var(--soft);border-radius:16px;padding:18px;margin-top:16px;color:var(--v)}
.cc{background:#0b0d12;color:#e7e9ee;min-height:100vh}.cc .mut{color:#8b93a7}.cc .box{background:#11141c;border-color:#1e2330;border-radius:14px}.cc .in{background:#0b0d12;border-color:#2a3042;color:#e7e9ee;color-scheme:dark}.cc .fld{color:#8b93a7}.cc .btn{border-color:#2a3042;color:#e7e9ee}.cc .btn.s{background:#34d399;border-color:#34d399;color:#04140d}.cc .empty{border-color:#2a3042;color:#8b93a7}.cc .tip{background:#161a24}.cc .li{border-color:#1e2330}.cc a{color:#34d399}
.ct{display:flex;align-items:center;gap:6px;padding:12px 26px;border-bottom:1px solid #1e2330;background:#0f1219;flex-wrap:wrap;position:sticky;top:0;z-index:4}.ct .logo{margin-right:10px}.cb{background:#34d399;color:#04140d;font:700 11px ui-monospace,monospace;padding:3px 8px;border-radius:4px;letter-spacing:.1em}
.ct .nav{border-radius:8px;padding:9px 14px;color:#8b93a7}.ct .nav.on{background:#1a1f2b;color:#34d399}.cp{padding:26px;max-width:1500px}.cp h1{margin:0 0 16px;font-size:28px;letter-spacing:-.02em}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.ck div{background:#11141c;border:1px solid #1e2330;border-radius:12px;padding:18px}.ck small{font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;color:#8b93a7}.ck b{display:block;font:600 32px ui-monospace,Menlo,monospace;margin-top:6px;letter-spacing:-.03em}.ck .g b{color:#34d399}.ck .a b{color:#fbbf24}
.sw{overflow:auto;border:1px solid #1e2330;border-radius:12px;max-height:70vh}.sh{border-collapse:separate;border-spacing:0;font:13px ui-monospace,Menlo,monospace;min-width:100%;white-space:nowrap}.sh th{position:sticky;top:0;background:#1a1f2b;color:#8b93a7;text-align:left;font-weight:500;padding:9px 12px;border-right:1px solid #262c3b;border-bottom:1px solid #262c3b;z-index:1}.sh td{padding:8px 12px;border-right:1px solid #1b2030;border-bottom:1px solid #1b2030}.sh tr:nth-child(even) td{background:#0e1119}.sh tr:hover td{background:#161b27}.sh .ix{background:#1a1f2b!important;color:#6b7390;text-align:center;position:sticky;left:0}.sh .r{text-align:right}.sh tfoot td{background:#1a1f2b!important;font-weight:700;position:sticky;bottom:0}
.cc .tag.ok{background:#0f3a2b;color:#5eead4}.cc .tag.wait{background:#3b2d08;color:#fbbf24}.cc .tag.no{background:#3d1520;color:#fb7185}.cc .tag{border-radius:4px;font-size:12px}.mb{display:inline-block;width:70px;height:6px;background:#262c3b;border-radius:9px;vertical-align:middle;margin-right:6px}.mb i{display:block;height:100%;background:#34d399;border-radius:9px}
.tb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tb .in{max-width:260px}.cc .cg{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}.cc .stk{display:flex;flex-direction:column;gap:18px}.cc .box form{flex-direction:row;flex-wrap:wrap;align-items:end}.mini{border:1px solid #2a3042;background:none;color:#e7e9ee;border-radius:6px;padding:3px 9px;font-size:12px;margin-left:4px}
@media(max-width:900px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}.side .sp,.side .who,.side .btn,.side .link{display:none}.side .logo{margin:0 8px 0 0}.hero,.grid,.g2,.kp,.ck,.cc .cg{grid-template-columns:1fr}.hero{padding:26px 22px;border-radius:0 0 32px 32px}.page{padding:0 18px 90px}.ph .gb{opacity:.35}.kp div{border-left:0;border-top:1px solid var(--line)}}
</style></head><body><div id="app"></div>
<aside class="dr" id="dr" hidden><header><span class="av"><svg viewBox="0 0 24 24" width="22" fill="currentColor"><rect x="3" y="13" width="4" height="8" rx="2"/><rect x="10" y="9" width="4" height="12" rx="2"/><rect x="17" y="3" width="4" height="18" rx="2"/></svg></span><div><b>Ton agent</b><div class="mut" style="font-size:14px">Coach IA · connaît tes chiffres</div></div><button class="x" data-a="agent">✕</button></header><div class="ch" id="ch"></div><div class="chips" id="cp"></div><form id="cf"><input id="ci" placeholder="Dis-lui où tu bloques…" autocomplete="off"><button>→</button></form></aside>
<script>

const MARK='<svg viewBox="0 0 24 24"><defs><linearGradient id="gm" x1="0" x2="1"><stop stop-color="#5a2bff"/><stop offset="1" stop-color="#e063f5"/></linearGradient></defs><g fill="url(#gm)"><rect x="2" y="14" width="5" height="7" rx="2.5"/><rect x="9.5" y="9" width="5" height="12" rx="2.5"/><rect x="17" y="3" width="5" height="18" rx="2.5"/></g></svg>';
const KEY='batcav_v3',$=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const iso=d=>d.toISOString().slice(0,10),TODAY=iso(new Date());
const fd=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const wv=t=>`<span class="wv">${[...t].map((c,i,a)=>`<span style="--i:${i};color:color-mix(in srgb,#5a2bff ${100-i/a.length*100}%,#e063f5)">${c==' '?'&nbsp;':c}</span>`).join('')}</span>`;
const COLS=['users','pay','act','slots','miss'],LK='batcav_v3';
let S={users:[],pay:[],act:[],slots:[],miss:[],cfg:{code:'',name:'',fee:0},me:null,view:'login',mode:'in',err:'',period:'m',newU:null,pf:'all'};
let page='dash',showPw=false,toastT,DB=null,OWNER=true,sess=null;try{sess=localStorage.getItem('batcav_sess')}catch(e){}
const setSess=v=>{sess=v;try{v?localStorage.setItem('batcav_sess',v):localStorage.removeItem('batcav_sess')}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsave=()=>{try{localStorage.setItem(LK,JSON.stringify({u:S.users,p:S.pay,a:S.act,s:S.slots,m:S.miss,c:S.cfg}))}catch(e){}};
function put(c,o){const i=S[c].findIndex(x=>x.id===o.id);i<0?S[c].push(o):S[c][i]=o;DB?DB.collection(c).doc(o.id).set(o).catch(()=>toast("Erreur d'enregistrement")):lsave()}
function del(c,id){S[c]=S[c].filter(x=>x.id!==id);DB?DB.collection(c).doc(id).delete().catch(()=>{}):lsave()}
const saveCfg=()=>DB?DB.doc('app/cfg').set(S.cfg).catch(()=>toast("Erreur d'enregistrement")):lsave();
const SL=()=>S.slots.slice().sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
const missL=()=>(S.miss.find(m=>m.id===S.me+TODAY)||{l:[]}).l;
const mkCode=()=>{const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c;do{c='FG-'+[...Array(4)].map(()=>A[Math.floor(Math.random()*A.length)]).join('')}while(S.users.some(u=>u.code==c));return c};
function after(){if(S.view=='login'&&sess&&!S.newU){if(sess=='coach')S.view='coach';else if(U(sess)){S.me=sess;S.view='stu'}}
if(!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))render()}
(async()=>{try{if(!window.claude)throw 0;const[db,us]=await Promise.all([claude.use('db'),claude.use('user')]);if(us)OWNER=us.isOwner();if(!db)throw 0;DB=db;
COLS.forEach(c=>db.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>({...d.data(),id:d.id}));after()}));db.doc('app/cfg').onSnapshot(sn=>{if(sn.exists)S.cfg={...S.cfg,...sn.data()};after()})}
catch(e){try{const d=JSON.parse(localStorage.getItem(LK));if(d){S.users=d.u;S.pay=d.p;S.act=d.a;S.slots=d.s;S.miss=d.m;S.cfg=d.c}}catch(x){}after()}})();
const U=id=>S.users.find(u=>u.id===id),ok=()=>S.pay.filter(p=>p.st==='ok');
const dn=(u)=>u.anon&&u.id!==S.me?'Membre anonyme':u.name+(u.id===S.me?' (toi)':'');
const mon=(o=0)=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)-o*7);return iso(d)};
const monthOf=d=>d.slice(0,7)===TODAY.slice(0,7),sum=f=>ok().filter(f).reduce((a,p)=>a+p.amt,0);
const actSum=(u,k,f=()=>true)=>S.act.filter(a=>a.u===u&&a.k===k&&f(a)).reduce((x,a)=>x+a.q,0);
function streak(u){let n=0;const d=new Date();while(S.act.some(a=>a.u===u&&a.d===iso(d))){n++;d.setDate(d.getDate()-1)}return n}
const ranking=()=>{const f=S.period==='m'?p=>monthOf(p.d):()=>true;return S.users.map(u=>({u,a:sum(p=>p.u===u.id&&f(p))})).sort((a,b)=>b.a-a.a)};
const MISS=['Envoyer 20 messages de prospection','Avancer sur un site client ou portfolio','Relancer les prospects qui n\'ont pas répondu','Noter tes chiffres du jour dans « Mes chiffres »'];
function toast(m){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}

function login(){const m=S.mode,nu=S.newU&&U(S.newU),up=m=='up',cc=m=='coach';let card;
if(nu)card=`<h2>Bienvenue ${esc(nu.name)} 🎉</h2><div class="mut">Voici ton code personnel : il te permet de te connecter à ton espace. Garde-le précieusement.</div><div class="code">${nu.code}</div><a class="btn s" style="margin-top:14px;display:flex" target="_blank" href="mailto:${esc(nu.email)}?subject=${encodeURIComponent('Bienvenue chez Full Grind')}&body=${encodeURIComponent('Salut '+nu.name+',\n\nBienvenue chez Full Grind, ton espace pour te surpasser, tout en étant accompagné.\n\nTon code d\'inscription : '+nu.code)}">M'envoyer le code par mail</a><button class="btn" style="width:100%;margin-top:10px" data-a="enter">Entrer dans mon espace</button>`;

const CH=['Comment passer devant ?','Je suis perdu','Motive-moi','Combien je facture ?','Écris-moi un message de prospection'];
const RP=['Regarde l\'écart avec le suivant dans le classement : un seul paiement peut suffire. Relance un ancien client aujourd\'hui.','Pas de panique. Une seule action : envoie 10 messages à des prospects chauds, puis reviens me voir.','Chaque message envoyé te rapproche d\'un client. Lance-toi sur 10 messages maintenant.','Pars sur la valeur livrée, pas sur le temps passé. Un site vitrine se facture rarement sous 500 €.','Dis-moi où tu bloques : prospection, devis ou relance ?'];
function chat(t,u){const c=$('#ch'),b=document.createElement('div');b.className='b'+(u?' u':'');b.textContent=t;c.append(b);c.scrollTop=1e9}
const AGENT_RULES=`Tu es l'agent personnel Full Grind d'un élève qui apprend à trouver des clients (prospection, devis, création de sites web). Parle en français, tutoie, ton direct et motivant, sans blabla. Réponses courtes : 2 à 5 phrases, avec une seule prochaine action concrète à la fin. Appuie-toi uniquement sur les données fournies : n'invente jamais de chiffres, de clients ou de résultats. Tu peux rédiger des messages de prospection, des relances et des devis, aider à fixer un prix et à structurer une offre : donne alors un texte prêt à copier. Ne promets jamais de revenus et ne donne pas de conseil juridique, fiscal ou financier personnalisé : renvoie vers le coach ou un professionnel. Ne parle jamais des autres élèves ni de leurs données. Si l'élève est découragé, valorise un progrès réel puis propose une petite action. Si la question n'a rien à voir avec son activité, redirige poliment. N'utilise pas de markdown (pas de titres, pas de gras), uniquement du texte simple.`;
let AG=[],agBusy=false;
function agentCtx(){const me=U(S.me),L=ranking(),pos=L.findIndex(r=>r.u.id===S.me),nx=SL().filter(s=>s.by===S.me&&s.d>=TODAY)[0];
return [`Prénom : ${me.name}`,`Total encaissé (validé) : ${eur(sum(p=>p.u===S.me))}`,`Ce mois : ${eur(sum(p=>p.u===S.me&&monthOf(p.d)))}`,`Cette semaine : ${eur(sum(p=>p.u===S.me&&p.d>=mon()))} sur un objectif de 1 500 €`,`Classement (${S.period=='m'?'ce mois':'depuis le début'}) : ${pos+1}e sur ${L.length}${pos>0?`, il manque ${eur(L[pos-1].a-L[pos].a+1)} pour passer devant le suivant`:' (1er)'}`,`Messages de prospection cette semaine : ${actSum(S.me,'m',a=>a.d>=mon())} sur 100`,`Clients signés au total : ${actSum(S.me,'c')}`,`Série de jours d'activité : ${streak(S.me)}`,`Missions du jour cochées : ${missL().length} sur ${MISS.length}`,`Paiements en attente de validation : ${S.pay.filter(p=>p.u===S.me&&p.st=='wait').length}`,`Prochain appel avec le coach : ${nx?fd(nx.d)+' à '+nx.t:'aucun de réservé'}`].join('\n')}
async function ask(t){chat(t,1);const i=CH.indexOf(t),fb=()=>RP[i<0?4:i];if(agBusy)return;
let smp=null;try{smp=window.claude&&await claude.use('sample')}catch(e){}
if(!smp){setTimeout(()=>chat(fb()),450);return}
agBusy=true;AG.push({r:'u',t});
const c=$('#ch'),b=document.createElement('div');b.className='b';b.textContent='…';c.append(b);c.scrollTop=1e9;
const hist=AG.slice(-10).map(m=>(m.r=='u'?'Élève : ':'Agent : ')+m.t).join('\n');
const prompt=AGENT_RULES+'\n\nDONNÉES DE L\'ÉLÈVE (à jour) :\n'+agentCtx()+'\n\nCONVERSATION :\n'+hist+'\n\nRéponds maintenant au dernier message de l\'élève.';
let out='';try{const r=await smp(prompt,{cache:false,modelTier:'quick',onText:({text})=>{b.textContent=text;c.scrollTop=1e9}});out=(r.text||'').trim()}catch(e){out=((e&&e.text)||'').trim()}
if(!out)out=fb();b.textContent=out;AG.push({r:'a',t:out});agBusy=false;c.scrollTop=1e9}
const enter=id=>{S.me=id;S.view='stu';page='dash';S.newU=null;S.err='';setSess(id)};
document.addEventListener('input',e=>{if(e.target.id=='flt'){const q=e.target.value.toLowerCase();document.querySelectorAll('tr[data-s]').forEach(r=>r.hidden=!r.dataset.s.includes(q))}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const[a,x,y]=el.dataset.a.split(':');if(el.tagName=='A'&&!el.href.startsWith('mailto'))e.preventDefault();
if(a=='agent'){const d=$('#dr');d.hidden=!d.hidden;if(!d.hidden&&!$('#ch').children.length){chat(sum(p=>p.u===S.me)?'Salut ! Dis-moi où tu en es sur tes objectifs de la semaine.':'Salut ! Tout part de zéro : c\'est le bon moment pour envoyer ton premier message. Qu\'est-ce qui te bloque ?');$('#cp').innerHTML=CH.map((c,i)=>`<button data-a="chip:${i}">${c}</button>`).join('')}return}
if(a=='chip'){ask(CH[x]);return}
if(a=='show'){showPw=!showPw;return}
if(a=='csv'){const dl=window.claude&&await claude.use('downloads');if(!dl)return toast('Export indisponible ici');const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',h=['Élève','E-mail','Code','Finalisé €','Nb finalisés','En attente €','Nb en attente','Ce mois €','Dernier paiement','Msgs 7j','Clients','Série','Dernière activité'];
const r=S.users.map(u=>{const s=stat(u);return [u.name,u.email,u.code,s.v,s.nv,s.w,s.nw,s.mo,s.lp,s.m7,s.c,s.sk,s.la].map(q).join(';')});try{await dl.save({filename:'suivi-eleves.csv',data:'\ufeff'+[h.map(q).join(';'),...r].join('\n')})}catch(err){}return}
if(a=='p'){page=x;S.err=''}
else if(a=='mode'){S.mode=x;S.err='';S.newU=null}
else if(a=='enter')enter(S.newU);
else if(a=='logout'){setSess(null);S.view='login';S.mode='in';S.me=null;page='dash'}
else if(a=='per')S.period=x;
else if(a=='pf')S.pf=x;
else if(a=='mis'){const id=S.me+TODAY,m=S.miss.find(z=>z.id==id)||{id,u:S.me,d:TODAY,l:[]},i=+x;m.l.includes(i)?m.l.splice(m.l.indexOf(i),1):m.l.push(i);put('miss',m);if(!S.act.some(z=>z.u===S.me&&z.d===TODAY))put('act',{id:uid(),u:S.me,d:TODAY,k:'x',q:0})}
else if(a=='anon'){const u=U(S.me);u.anon=el.checked;put('users',u)}
else if(a=='book'||a=='unb'){const s=S.slots.find(z=>z.id===x);if(a=='book'&&s.by)return toast('Créneau déjà pris');s.by=a=='book'?S.me:null;put('slots',s)}
else if(a=='ds')del('slots',x);
else if(a=='v'){const p=S.pay.find(z=>z.id===x);p.st=y;put('pay',p);toast(y=='ok'?'Paiement finalisé':y=='no'?'Paiement refusé':'Remis en attente')}
render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id=='cf'){const v=$('#ci').value.trim();if(v){ask(v);$('#ci').value=''}return}
const d=Object.fromEntries(new FormData(f)),k=f.dataset.f,id=uid();S.err='';
if(k=='in'){const u=S.users.find(x=>x.code==d.code.trim().toUpperCase());u?enter(u.id):S.err='Code inconnu. Vérifie le mail reçu à ton inscription.'}
if(k=='up'){const em=d.email.trim().toLowerCase();if(S.users.some(u=>(u.email||'').toLowerCase()==em))S.err='Un compte existe déjà avec cet e-mail. Utilise ton code (ou demande-le à ton coach).';else{const u={id,name:d.name.trim(),email:em,code:mkCode(),anon:false,at:TODAY};put('users',u);S.newU=id}}
if(k=='coach'){if(!S.cfg.code){S.cfg={...S.cfg,code:d.code,name:d.name||''};saveCfg();S.view='coach';page='dash';setSess('coach')}else if(d.code==S.cfg.code){S.view='coach';page='dash';setSess('coach')}else S.err='Code coach incorrect.'}
if(k=='newu'){const em=d.email.trim().toLowerCase();if(S.users.some(u=>(u.email||'').toLowerCase()==em))S.err='Un élève existe déjà avec cet e-mail.';else{const u={id,name:d.name.trim(),email:em,code:mkCode(),anon:false,at:TODAY};put('users',u);S.cn=id;toast('Élève créé : '+u.code)}}
if(k=='decl'){put('pay',{id,u:S.me,amt:+d.amt,d:d.d,note:d.note,st:'wait'});toast('Envoyé à ton coach pour validation')}
if(k=='act'){put('act',{id,u:S.me,d:TODAY,k:d.k,q:+d.q,note:d.note});toast('Activité ajoutée')}
if(k=='add'){put('pay',{id,u:d.u,amt:+d.amt,d:d.d||TODAY,note:d.note,st:'ok'});toast('Résultat ajouté')}
if(k=='slots'){const m=t=>+t.slice(0,2)*60+ +t.slice(3),h=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');let c=0;for(let t=m(d.a);t+ +d.n<=m(d.z);t+=+d.n){const T=h(t);if(!S.slots.some(s=>s.d==d.d&&s.t==T)){put('slots',{id:uid(),d:d.d,t:T,by:null});c++}}toast(c+' créneau(x) ouvert(s)')}
render()});
render();
</script></body></html>
